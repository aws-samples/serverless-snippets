AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Fully featured EventBridge subscriber with filter, retry, DLQ, and JSONata transform.

Parameters:
  EventBusArn:
    Type: String
    Description: ARN of the enhanced custom event bus to subscribe to.
  TargetArn:
    Type: String
    Description: ARN of the target that receives the events (for example an SQS queue).
  RoleArn:
    Type: String
    Description: ARN of the IAM role EventBridge assumes to invoke the target and the DLQ.
  DeadLetterQueueArn:
    Type: String
    Description: ARN of the SQS queue that receives events that exhaust their retries.

Resources:
  FullSubscriber:
    Type: AWS::EventsV2::Subscriber
    Properties:
      Name: !Sub '${AWS::StackName}-orders-full'
      EventBusArn: !Ref EventBusArn
      InvokeConfiguration:
        TargetArn: !Ref TargetArn
        RoleArn: !Ref RoleArn
      FilterConfiguration:
        Filters:
          - Scope: DATA
            Pattern: '{"detail":{"$or":[{"priority":["HIGH"]},{"total":[{"numeric":[">=",1000]}]}]}}'
      RetryPolicy:
        MaxRetryAttempts: 10
        MaxEventAgeInSeconds: 3600
      OnFailureConfiguration:
        Arn: !Ref DeadLetterQueueArn
      Transformer:
        Type: JSONATA
        JsonataConfiguration:
          Expression: '{% { "orderId": $events.Data.detail.orderId, "total": $events.Data.detail.total } %}'

Outputs:
  SubscriberArn:
    Description: ARN of the created subscriber.
    Value: !GetAtt FullSubscriber.SubscriberArn
